name: Archive published cash reports

on:
  push:
    branches: [main]
    paths:
      - 'reports/latest/index.html'
      - 'scripts/archive-reports.py'
      - '.github/workflows/archive-reports.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cash-report-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Save every reporting period
        run: python3 scripts/archive-reports.py
      - name: Commit archive changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/history.json reports/archive
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Archive published cash reporting periods'
          git pull --rebase origin main
          git push origin HEAD:main
