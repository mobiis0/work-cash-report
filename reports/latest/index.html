body{padding:30px 22px}@media(max-width:650px){body{padding:12px 8px}}@media print{body{padding:0}}</style></head><body><main id="report"></main><script>
(()=>{
const evidenceStockFields = [
  {key:'005380',label:'현대차 보유 주식수',unit:'주'},
  {key:'250060',label:'모비스 보유 주식수',unit:'주'},
  {key:'290270',label:'휴네시온 보유 주식수',unit:'주'},
  {key:'deposit',label:'NH투자증권 예수금',unit:'원'}
];
function evidenceNumber(value){
  if(typeof value==='number')return Number.isFinite(value)?value:null;
  const s=String(value??'').trim().replace(/[원주\s]/g,'');
  if(!s||!/^[-+]?(?:\d+|\d{1,3}(?:,\d{3})+)(?:\.\d+)?$/.test(s))return null;
  const n=Number(s.replaceAll(',',''));return Number.isFinite(n)?n:null;
}
function evidenceLines(words){
  const sorted=words.filter(w=>w.text?.trim()&&w.bbox).sort((a,b)=>a.bbox.y0-b.bbox.y0||a.bbox.x0-b.bbox.x0);
  const groups=[];
  for(const word of sorted){
    const cy=(word.bbox.y0+word.bbox.y1)/2,h=word.bbox.y1-word.bbox.y0;
    let line=groups.find(g=>Math.abs(g.cy-cy)<Math.max(6,Math.min(g.h,h)*.6));
    if(!line){line={cy,h,words:[]};groups.push(line);}
    line.words.push(word);
  }
  return groups.sort((a,b)=>a.cy-b.cy).map(g=>g.words.sort((a,b)=>a.bbox.x0-b.bbox.x0));
}
function nhDepositRegion(pixels,width,height){
  const gray=(x,y)=>{const i=(y*width+x)*4,r=pixels[i],g=pixels[i+1],b=pixels[i+2];return r>130&&r<235&&Math.max(r,g,b)-Math.min(r,g,b)<30;};
  const rows=[];
  for(let y=0;y<height*.4;y++){
    let count=0;for(let x=Math.round(width*.02);x<width*.34;x++)if(gray(x,y))count++;
    if(count>width*.25&&(rows.length===0||y-rows.at(-1)>2))rows.push(y);
  }
  for(let i=0;i+3<rows.length;i++){
    const gap=rows[i+1]-rows[i];
    if(gap<16||gap>height*.16||Math.abs(rows[i+2]-rows[i+1]-gap)>2||Math.abs(rows[i+3]-rows[i+2]-gap)>2)continue;
    const top=rows[i+2],bottom=rows[i+3];
    // The summary value occupies the second of six columns; leave out 원.
    const left=Math.round(width*.155),right=Math.round(width*.35-(bottom-top)*.6);
    if(right<=left)return null;
    return {left,top:top+2,width:right-left,height:bottom-top-4};
  }
  return null;
}
function parseEvidenceOCR(kind,data,width,height){
  const words=data.words||data.blocks?.flatMap(b=>b.paragraphs?.flatMap(p=>p.lines?.flatMap(l=>l.words||[])||[])||[])||[];
  const lines=evidenceLines(words),fields=[];
  const text=data.text||lines.map(line=>line.map(w=>w.text).join(' ')).join('\n');
  const dates=[...text.matchAll(/(20\d{2})\s*[-./]\s*(\d{1,2})\s*[-./]\s*(\d{1,2})/g)]
    .map(m=>`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`).sort();
  if(kind==='bank'){
    for(const line of lines){
      const account=line.find(w=>/^\d{10,16}$/.test(w.text.replace(/\s/g,'')));
      if(!account){
        const code=line.find(w=>/^\d{5}$/.test(w.text)&&w.bbox.x0<width*.10);
        if(code)fields.push({key:'',label:'계좌 식별 확인 필요 (코드 '+code.text+')',value:null,confidence:0,confirmed:false});
        continue;
      }
      const amounts=line.filter(w=>w.bbox.x0>account.bbox.x1&&w.bbox.x0<width*.50)
        .map(w=>({...w,value:evidenceNumber(w.text)})).filter(w=>w.value!==null);
      // The supplied ERP layout has four columns (opening/in/out/closing) in its left ledger.
      // Missing cells must not shift another column into the closing balance.
      const balance=amounts.length===4?amounts[3]:null;
      fields.push({key:account.text.replace(/\D/g,'').slice(-4),label:'계좌 •••• '+account.text.replace(/\D/g,'').slice(-4),
        value:balance?.value??null,confidence:Math.min(account.confidence??0,balance?.confidence??0),confirmed:false});
    }
  }else{
    for(const spec of evidenceStockFields){
      if(spec.key==='deposit')continue;
      const line=lines.find(line=>line.some(w=>w.text.replace(/\D/g,'').padStart(6,'0')===spec.key));
      const code=line?.find(w=>w.text.replace(/\D/g,'').padStart(6,'0')===spec.key);
      const qty=code&&line.find(w=>w.bbox.x0>code.bbox.x1&&evidenceNumber(w.text)!==null);
      fields.push({...spec,value:qty?evidenceNumber(qty.text):null,confidence:qty?.confidence??0,confirmed:false});
    }
    // OCR can split Korean labels into several words. Keep the search in the
    // first summary column and never substitute withdrawable cash or D+1/D+2.
    let deposit=null;
    for(const line of lines){
      const left=line.filter(w=>w.bbox.x0<width*.155);
      if(left.map(w=>w.text).join('').replace(/\s/g,'')==='예수금'){
        deposit=line.find(w=>w.bbox.x0>width*.155&&w.bbox.x0<width*.35&&evidenceNumber(w.text)!==null);
        if(deposit)break;
      }
    }
    // A separate numeric-only pass reads the third row of the NH summary grid,
    // excluding the won glyph. It is independent of Korean label recognition.
    const numeric=data.nhDeposit;
    const depositValue=numeric?.value??(deposit?evidenceNumber(deposit.text):null);
    const depositConfidence=numeric?.confidence??deposit?.confidence??0;
    fields.push({...evidenceStockFields[3],value:depositValue,confidence:depositConfidence,confirmed:false});
  }
  return {fields,date:dates.at(-1)||'',dateConfirmed:false};
}
function compareEvidence(report,proof){
  const dateState=proof.dateSource==='report'||!proof.date?'match':proof.date===report.end?'match':'mismatch';
  const fields=proof.kind==='nh'?evidenceStockFields.map(spec=>({...spec,...proof.fields.find(f=>f.key===spec.key)})):proof.fields;
  const results=fields.map(field=>{
    let expected=null,reason='',target='';
    if(proof.kind==='bank'){
      const suffix=String(field.key).replace(/\D/g,'');
      const matches=report.rows.filter(row=>row.currency==='KRW'&&String(row.account).replace(/\D/g,'').endsWith(suffix)&&suffix.length===4);
      if(matches.length===1){expected=matches[0].current;target=matches[0].bank+' '+matches[0].type;}
      else reason=matches.length?'계좌 연결이 중복됩니다.':'보고서에서 해당 원화 계좌를 찾지 못했습니다.';
    }else if(field.key==='deposit'){
      const matches=report.stocks.filter(s=>/NH|엔에이치/i.test(s.broker+' '+s.name)&&s.quantity===null);
      if(matches.length===1){expected=matches[0].current;target='NH투자증권 예수금';}else reason='NH 예수금 항목을 하나로 연결할 수 없습니다.';
    }else{
      const names={'005380':'현대차','250060':'모비스','290270':'휴네시온'};
      const matches=report.stocks.filter(s=>s.name.replace(/\s/g,'')===names[field.key]&&s.quantity!==null);
      if(matches.length===1){expected=matches[0].quantity;target=names[field.key];}else reason='보고서에서 해당 보유 주식수를 찾지 못했습니다.';
    }
    const actual=evidenceNumber(field.value);
    let state=actual===null||expected===null?'unknown':Math.abs(actual-expected)<.005?'match':'mismatch';
    if(actual===null)reason='증빙에서 숫자를 읽지 못했습니다.';
    return{...field,actual,expected,target,state,reason,difference:actual===null||expected===null?null:actual-expected,unit:field.unit||'원'};
  });
  const counts={match:0,mismatch:0,review:0,unknown:0};results.forEach(r=>counts[r.state]++);
  const state=dateState==='mismatch'||counts.mismatch?'mismatch':dateState!=='match'||!results.length||counts.unknown||counts.review?'review':'match';
  return{dateState,results,counts,state};
}

const evEscape=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const evFormat=value=>value===null||value===undefined?'—':Number(value).toLocaleString('ko-KR',{maximumFractionDigits:2});
const evLabels={match:'일치',mismatch:'불일치',review:'확인 필요',unknown:'미확인'};
function safeEvidenceImage(value){return /^data:image\/(?:png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(value||'')?value:'';}
function evidencePageHTML(report){
  const proofs=report.evidence?.proofs||[];
  const summary=proofs.map(proof=>compareEvidence(report,proof));
  return `<section class="evidence-page"><header class="evidence-page-heading"><div><p>SUPPORTING DOCUMENTS</p><h1>증빙 대조</h1><span>${evEscape(report.start)} ~ ${evEscape(report.end)}</span></div><a href="#report" class="evidence-back">자금일보로 돌아가기</a></header>
    ${!proofs.length?'<div class="evidence-empty">이 보고서에 첨부된 증빙이 없습니다. 보고서 생성 화면에서 증빙을 첨부한 뒤 다시 생성·게시하면 여기에 표시됩니다.</div>':`<p class="evidence-intro">증빙 원본과 보고서의 금주 값을 대조합니다. 은행은 잔액, NH투자증권은 3종목 보유 주식수와 예수금만 확인합니다.</p>`}
    ${proofs.map((proof,i)=>{const check=summary[i],src=safeEvidenceImage(proof.image);return `<article class="evidence-card"><div class="evidence-card-heading"><h2>${proof.kind==='nh'?'NH투자증권':'은행 잔액'} 증빙</h2><span class="ev-state ev-${check.state}">${evLabels[check.state]}</span></div><div class="evidence-comparison"><div class="evidence-original"><p>증빙 원본 · ${evEscape(proof.fileName)}</p>${src?`<button type="button" class="ev-image-open" aria-label="증빙 이미지 확대"><img src="${src}" alt="${proof.kind==='nh'?'NH투자증권 잔고':'은행 잔액'} 증빙 원본"></button><small>이미지를 클릭하면 확대할 수 있습니다.</small>`:'<p>이미지 형식을 확인할 수 없습니다.</p>'}</div><div class="evidence-checks"><p class="evidence-date ev-date-${check.dateState}">대조 기준일: ${evEscape(proof.dateSource==='report'||!proof.date?report.end:proof.date)} · 자금일보 작성일 적용</p><div class="evidence-table-scroll"><table class="evidence-table"><thead><tr><th>대조 항목</th><th>증빙</th><th>보고서</th><th>결과</th></tr></thead><tbody>${check.results.map(row=>`<tr><th>${evEscape(row.target||row.label)}${proof.kind==='bank'?`<small>•••• ${evEscape(row.key)}</small>`:''}</th><td>${evFormat(row.actual)}<small>${evEscape(row.unit)}</small></td><td>${evFormat(row.expected)}<small>${evEscape(row.unit)}</small></td><td><span class="ev-state ev-${row.state}">${evLabels[row.state]}</span>${row.state==='mismatch'?`<small>차이 ${evFormat(row.difference)}${evEscape(row.unit)}</small>`:row.reason?`<small>${evEscape(row.reason)}</small>`:''}</td></tr>`).join('')||'<tr><td colspan="4">대조할 숫자를 읽지 못했습니다. 생성 화면에서 확인해 주세요.</td></tr>'}</tbody></table></div><p class="evidence-check-summary">일치 ${check.counts.match} · 불일치 ${check.counts.mismatch} · 확인 필요 ${check.counts.review+check.counts.unknown}</p>${proof.kind==='bank'?'<p class="evidence-note">증빙에 표시된 계좌만 대조합니다. 누적 입출금액과 주간 입출금액은 기간이 달라 비교하지 않습니다.</p>':'<p class="evidence-note">주가·평가금액·순자산·채권은 대조 대상에 포함하지 않습니다.</p>'}</div></div></article>`;}).join('')}
  </section>`;
}
function installEvidenceView(root,report){
  const page=document.createElement('div');page.id='evidence';page.className='evidence-view';page.hidden=true;page.innerHTML=evidencePageHTML(report);root.append(page);
  const documentView=root.querySelector('.cash-document'),toolbar=root.querySelector('.treasury-toolbar');
  const update=()=>{const show=location.hash==='#evidence';page.hidden=!show;documentView.hidden=show;if(toolbar)toolbar.hidden=show;if(show)page.scrollIntoView({block:'start'});};
  const dialog=document.createElement('dialog');dialog.className='ev-image-dialog';
  dialog.innerHTML='<button type="button">닫기</button><img alt="확대한 증빙 원본">';root.append(dialog);
  dialog.querySelector('button').addEventListener('click',()=>dialog.close());
  page.addEventListener('click',event=>{const button=event.target.closest('.ev-image-open');if(button){dialog.querySelector('img').src=button.querySelector('img').src;dialog.showModal();}});
  window.addEventListener('hashchange',update);update();
  return()=>{window.removeEventListener('hashchange',update);page.remove();dialog.remove();};
}
let evOCRScript=null,evOCRQueue=Promise.resolve();
async function readEvidenceImage(image,onProgress,depositImage){
  onProgress('숫자 읽기 도구를 준비하는 중입니다.');
  evOCRScript??=new Promise((resolve,reject)=>{
    const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    const failed=()=>{evOCRScript=null;script.remove();reject(Error('숫자 읽기 도구를 불러오지 못했습니다. 아래에 직접 입력할 수 있습니다.'));};
    const timeout=setTimeout(failed,25000);
    script.onload=()=>{clearTimeout(timeout);resolve();};script.onerror=()=>{clearTimeout(timeout);failed();};document.head.append(script);
  });
  await evOCRScript;
  const job=evOCRQueue.then(async()=>{
    const loading=Tesseract.createWorker('kor+eng',1,{
      workerPath:'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',
      corePath:'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.0',
      langPath:'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main',gzip:false,cachePath:'mobiis-tessdata-fast-v1',
      logger:message=>onProgress(message.status==='recognizing text'?`숫자를 읽는 중 ${Math.round(message.progress*100)}%`:'숫자 읽기 도구를 준비하는 중입니다.')
    });
    let worker,timer;
    try{worker=await Promise.race([loading,new Promise((resolve,reject)=>{timer=setTimeout(()=>reject(Error('숫자 읽기 준비가 지연되고 있습니다. 아래에서 직접 입력할 수 있습니다.')),60000);})]);}
    catch(error){loading.then(lateWorker=>lateWorker.terminate()).catch(()=>{});throw error;}
    finally{clearTimeout(timer);}
    try{
      await worker.setParameters({tessedit_pageseg_mode:'6'});

function mountReportHistory(root, latestReport, render) {
  const idOf = data => `${data.start}_${data.end}`;
  const period = data => `${data.start.replaceAll('-', '.')} ~ ${data.end.replaceAll('-', '.')}`;
  const validEntry = entry => entry && /^\d{4}-\d{2}-\d{2}$/.test(entry.start) &&
    /^\d{4}-\d{2}-\d{2}$/.test(entry.end) && entry.start <= entry.end &&
    entry.id === idOf(entry) && entry.path === `archive/${entry.id}.json`;
  let currentId = idOf(latestReport), selectedId = currentId;
  let entries = [{id: currentId, start: latestReport.start, end: latestReport.end,
    updatedAt: latestReport.updatedAt, path: `archive/${currentId}.json`}];
  const cache = new Map([[currentId, latestReport]]);
  let cleanup, selection = 0, refreshing = false, disposed = false, verified = false;
  const menu = document.createElement('details');
  menu.className = 'report-history';
  const heading = document.createElement('summary');
  heading.setAttribute('aria-label', '보고기간 선택 · 이전 보고서 보기');
  const title = document.createElement('span');
  const badge = document.createElement('span');
  badge.className = 'report-history-badge';
  const arrow = document.createElement('span');
  arrow.className = 'report-history-arrow';
  arrow.textContent = '▾';
  arrow.setAttribute('aria-hidden', 'true');
  heading.append(title, badge, arrow);
  const list = document.createElement('div');
  list.className = 'report-history-list';
  list.setAttribute('aria-label', '게시된 보고서 목록');
  const message = document.createElement('p');
  message.className = 'report-history-status';
  message.setAttribute('role', 'status');
  menu.append(heading, list);
  const localBase = new URL('../', location.href);
  const remoteBase = new URL('https://raw.githubusercontent.com/mobiis0/work-cash-report/main/reports/');
  const base = location.hostname === 'mobiis0.github.io' ? remoteBase : localBase;
  const requestedPeriod = () => new URL(location.href).searchParams.get('period');
  function updateBadge() {
    badge.textContent = !verified ? '최신 확인 중' : selectedId === currentId ? '최신' : '이전 보고서';
  }
  function refreshList() {
    list.replaceChildren();
    for (const entry of entries) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'report-history-option';
      button.dataset.period = entry.id;
      button.setAttribute('aria-current', entry.id === selectedId ? 'true' : 'false');
      const name = document.createElement('span');
      name.textContent = period(entry);
      const tag = document.createElement('small');
      tag.textContent = entry.id === currentId ? '최신' : '이전 보고서';
      button.append(name, tag);
      button.addEventListener('click', () => select(entry));
      list.append(button);
    }
    list.append(message);
  }
  function show(data) {
    cleanup?.();
    cleanup = render(root, data);
    selectedId = idOf(data);
    title.textContent = period(data);
    updateBadge();
    document.title = `모비스 주간자금현황 ${data.end}`;
    const oldPeriod = root.querySelector('.report-heading > div > p');
    if (oldPeriod) oldPeriod.replaceWith(menu);
    else root.querySelector('.report-heading > div')?.append(menu);
    refreshList();
  }
  async function readJSON(path) {
    const url = new URL(path, base);
    // no-store bypasses browser storage; a unique URL also avoids stale CDN responses.
    url.searchParams.set('_fresh', `${Date.now()}-${++readJSON.sequence}`);
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 15000);
    try {
      const response = await fetch(url, {cache: 'no-store', signal: controller.signal});
      if (!response.ok) throw new Error('보고서를 불러오지 못했습니다.');
      return await response.json();
    } finally { clearTimeout(timeout); }
  }
  readJSON.sequence = 0;
  async function select(entry, updateURL = true, force = false) {
    const request = ++selection;
    message.textContent = '보고서를 불러오는 중입니다.';
    try {
      const cached = cache.get(entry.id);
      const data = !force && cached && cached.updatedAt === entry.updatedAt ? cached : await readJSON(entry.path);
      if (disposed || request !== selection) return false;
      if (idOf(data) !== entry.id || !Array.isArray(data.rows) || !Array.isArray(data.summary))
        throw new Error('보고기간을 확인할 수 없습니다.');
      cache.set(entry.id, data);
      show(data);
      message.textContent = '';
      menu.open = false;
      if (updateURL) {
        const url = new URL(location.href);
        if (entry.id === currentId) url.searchParams.delete('period');
        else url.searchParams.set('period', entry.id);
        history.pushState(null, '', url);
        heading.focus();
      }
      return true;
    } catch {
      if (!disposed && request === selection) {
        message.textContent = '보고서를 불러오지 못했습니다. 연결이 복구되면 자동으로 다시 확인합니다.';
        badge.textContent = '갱신 확인 필요';
      }
      return false;
    }
  }
  async function refreshLatest() {
    if (disposed || refreshing || document.visibilityState === 'hidden') return;
    refreshing = true;
    const selectionAtStart = selection;
    try {
      const index = await readJSON('history.json');
      if (disposed) return;
      if (!Array.isArray(index.reports) || !index.reports.length || !index.reports.every(validEntry))
        throw new Error('목록이 없습니다.');
      const unique = new Map(index.reports.map(entry => [entry.id, entry]));
      // The new HTML can arrive just before the archive workflow completes.
      if (!unique.has(idOf(latestReport))) unique.set(idOf(latestReport), {
        id: idOf(latestReport), start: latestReport.start, end: latestReport.end,
        updatedAt: latestReport.updatedAt, path: `archive/${idOf(latestReport)}.json`

      entries = [...unique.values()].sort((a, b) => b.end.localeCompare(a.end) || b.start.localeCompare(a.start));
      currentId = entries[0].id;
      refreshList();
      // A manual period choice made during the request takes precedence.
      if (selection !== selectionAtStart) return;
      const requested = requestedPeriod();
      const target = entries.find(entry => entry.id === requested) || entries[0];
      const cached = cache.get(target.id);
      const changed = !verified || target.id !== selectedId || cached?.updatedAt !== target.updatedAt;
      // An embedded report not yet archived is already newer than the archive index.
      const awaitingArchive = target.id === idOf(latestReport) && !index.reports.some(entry => entry.id === target.id);
      if (changed && !awaitingArchive) {
        if (!await select(target, false, !verified)) return;
      }
      verified = true;
      updateBadge();
      message.textContent = requested && !entries.some(entry => entry.id === requested)
        ? '해당 보고기간이 없어 최신 보고서를 표시합니다.' : '';
    } catch {
      if (!disposed) {
        message.textContent = '최신 보고서 확인에 실패했습니다. 연결이 복구되면 자동으로 다시 확인합니다.';
        badge.textContent = '갱신 확인 필요';
      }
    } finally { refreshing = false; }
  }
  show(latestReport);
  if (location.protocol === 'file:') {
    verified = true;
    updateBadge();
    message.textContent = '이전 보고서는 게시된 사이트에서 확인할 수 있습니다.';
    return () => { disposed = true; cleanup?.(); };
  }
  const outside = event => { if (!menu.contains(event.target)) menu.open = false; };
  const escape = event => { if (event.key === 'Escape') { menu.open = false; heading.focus(); } };
  const popstate = () => {
    const entry = entries.find(entry => entry.id === (requestedPeriod() || currentId));
    if (entry) select(entry, false);
  };
  const visible = () => { if (document.visibilityState === 'visible') refreshLatest(); };
  document.addEventListener('click', outside);
  menu.addEventListener('keydown', escape);
  document.addEventListener('visibilitychange', visible);
  window.addEventListener('focus', refreshLatest);
  window.addEventListener('pageshow', refreshLatest);
  window.addEventListener('online', refreshLatest);
  window.addEventListener('popstate', popstate);
  const interval = setInterval(refreshLatest, 60000);
  refreshLatest();
  return () => {
    disposed = true;
    selection++;
    clearInterval(interval);
    document.removeEventListener('click', outside);
    menu.removeEventListener('keydown', escape);
    document.removeEventListener('visibilitychange', visible);
    window.removeEventListener('focus', refreshLatest);
    window.removeEventListener('pageshow', refreshLatest);
    window.removeEventListener('online', refreshLatest);
    window.removeEventListener('popstate', popstate);
    cleanup?.();
  };
}
